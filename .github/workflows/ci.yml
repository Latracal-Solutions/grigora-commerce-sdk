name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Upload CDN bundle
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: sdk-bundle
          path: |
            packages/sdk/dist/sdk.js
            packages/sdk/dist/sdk.min.js
            packages/sdk/dist/*.map
